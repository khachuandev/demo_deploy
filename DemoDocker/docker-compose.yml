version: "3.8"

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: demo_docker
    ports:
      - "3386:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - docker_demo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  spring-app:
    build: .
    container_name: spring-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - docker_demo

  frontend:
    build: ../demo_docker_fe     # Trỏ vào thư mục frontend
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - spring-app
    networks:
      - docker_demo

networks:
  docker_demo:

volumes:
  db_data: